   <div class="image-container">

<h3> Contact Me To Book an Appointment</h3>
    <section class="contact-form">
    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>

        <label for="service">Service Needed:</label><br>
        <select id="service" name="service">
            <option>Washing Machine Repair</option>
            <option>TV Repair</option>
            <option>Computer Repair</option>
            <option>Door Repair</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" placeholder="Describe the problem..." required></textarea><br><br>

        <input type="submit" value="Book Appointment">

    </form>
</section>

    </main>
